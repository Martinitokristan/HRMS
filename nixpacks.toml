[variables]
    # Remove hardcoded PORT to let Railway decide

[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs-18_x"]

[phases.install]
cmds = ["composer install --no-dev --no-interaction --prefer-dist", "npm install"]

[phases.build]
cmds = ["npm run prod"]

[start]
cmd = "php artisan config:clear && php artisan cache:clear && php artisan storage:link && php artisan migrate:fresh --seed && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
